<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.json"><title>EvidenceFeed v5</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui;background:#07111f;color:#f8fafc}button{font:inherit}header{position:fixed;z-index:9;top:0;left:0;right:0;height:58px;background:#07111fee;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #ffffff18}.brand{font-weight:900;font-size:20px}.brand b{color:#67e8f9}.ver{margin-left:auto;color:#94a3b8;font-size:12px}main{height:100%;padding:58px 0 68px}.view{display:none;height:100%}.view.active{display:block}#feed{overflow-y:auto;scroll-snap-type:y mandatory}.reel{height:calc(100dvh - 126px);min-height:520px;scroll-snap-align:start;padding:24px;display:flex;flex-direction:column;justify-content:center;position:relative;border-bottom:1px solid #ffffff15;background:radial-gradient(circle at 80% 15%,#155e7566,transparent 30%),linear-gradient(150deg,#0c1c30,#07111f)}.ey{font-size:12px;letter-spacing:.14em;color:#67e8f9;font-weight:900}.reel h1{font-size:clamp(30px,8vw,48px);line-height:1.02;margin:10px 0 18px}.reel p{font-size:18px;line-height:1.55;color:#dbeafe}.num{position:absolute;right:18px;bottom:15px;color:#64748b}.panel{height:100%;overflow:auto;padding:18px;max-width:820px;margin:auto}.card{background:#0d1b2d;border:1px solid #ffffff16;border-radius:18px;padding:18px;margin-bottom:14px}.opt{width:100%;text-align:left;padding:13px;margin:6px 0;border-radius:12px;border:1px solid #ffffff22;background:#12243b;color:#fff}.correct{background:#14532d!important}.wrong{background:#7f1d1d!important}.comment{display:none;background:#083344;margin-top:10px;padding:12px;border-radius:12px}.tabs{position:fixed;z-index:10;bottom:0;left:0;right:0;height:68px;background:#07111ff5;border-top:1px solid #ffffff18;display:grid;grid-template-columns:repeat(4,1fr)}.tab{border:0;background:none;color:#94a3b8;font-size:11px;font-weight:800}.tab span{display:block;font-size:21px}.tab.active{color:#67e8f9}.notice{background:#0d1b2d;border:1px dashed #ffffff30;padding:20px;border-radius:18px;line-height:1.6}.toggle{display:flex;gap:8px;margin:16px 0}.toggle button{padding:10px;border:1px solid #ffffff22;border-radius:10px;background:#12243b;color:white}
</style></head><body><header><div class="brand">Evidence<b>Feed</b></div><div class="ver">v5</div></header><main><section id="feed" class="view active"></section><section id="questions" class="view"><div class="panel" id="q"></div></section><section id="review" class="view"><div class="panel" id="r"></div></section><section id="article" class="view"><div class="panel" id="a"></div></section></main><nav class="tabs"><button class="tab active" data-v="feed"><span>🎞️</span>Feed</button><button class="tab" data-v="questions"><span>❓</span>Questions</button><button class="tab" data-v="review"><span>🔁</span>Review</button><button class="tab" data-v="article"><span>📄</span>Article</button></nav><script>
let A;async function load(){let x=await fetch('articles/index.json',{cache:'no-store'}).then(r=>r.json());A=await fetch('articles/'+x.articles[0].file,{cache:'no-store'}).then(r=>r.json());render()}function render(){feed.innerHTML=A.reels.map((x,i)=>`<article class="reel"><div class="ey">${x.eyebrow}</div><h1>${x.title}</h1><p>${x.text}</p><div class="num">${i+1}/${A.reels.length} ↑</div></article>`).join('');quiz(A.questions,q,'Questions');quiz([...A.review].sort(()=>Math.random()-.5),r,'Review • 50 questões');art('original')}function quiz(xs,el,title){el.innerHTML=`<h2>${title}</h2>`+xs.map((x,i)=>`<div class="card"><small>${i+1} de ${xs.length}</small><h3>${x.question}</h3>${x.options.map(o=>`<button class="opt" data-a="${encodeURIComponent(x.answer)}">${o}</button>`).join('')}<div class="comment"><b>Comentário:</b> ${x.comment}</div></div>`).join('');el.querySelectorAll('.card').forEach(c=>c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(c.dataset.d)return;c.dataset.d=1;let a=decodeURIComponent(b.dataset.a);c.querySelectorAll('.opt').forEach(z=>{if(z.textContent===a)z.classList.add('correct')});if(b.textContent!==a)b.classList.add('wrong');c.querySelector('.comment').style.display='block'}))}function art(lang){a.innerHTML=`<h2>${A.title}</h2><p>${A.authors}<br>${A.journal} (${A.year}) • DOI ${A.doi}</p><div class="toggle"><button onclick="art('original')">🇺🇸 Original</button><button onclick="art('pt')">🇧🇷 Português</button></div><div class="notice">${lang==='original'?'O PDF original não está incorporado neste pacote de demonstração. Esta área está pronta para receber o PDF fornecido pelo usuário.':'A versão traduzida não está incorporada nesta demonstração. Quando o PDF for fornecido, esta área poderá exibir a tradução para português.'}</div>`}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.v).classList.add('active')});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');load().catch(e=>feed.innerHTML='<div class="panel"><div class="notice">Erro: '+e.message+'</div></div>')
</script></body></html>
