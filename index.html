<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff"><link rel="manifest" href="./manifest.json"><title>EvidenceFeed v4.3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#101828;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:600px;margin:auto;min-height:100vh;background:#fafafa;padding-bottom:78px}
header{position:sticky;top:0;z-index:10;background:#fffd;backdrop-filter:blur(12px);border-bottom:1px solid #e5e7eb;padding:14px 16px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:950}.brand b{color:#315efb}.pill,.btn{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 12px;font-weight:850}.tabs{display:flex;gap:5px;overflow:auto;background:#eceff3;padding:4px;border-radius:13px;margin-top:14px}.tab{min-width:100px;border:0;background:transparent;padding:10px 6px;border-radius:10px;font-weight:850;color:#667085}.tab.on{background:white;color:#111;box-shadow:0 1px 5px #0002}
main{padding:16px}.screen{display:none}.screen.on{display:block}.card,.panel{background:#fff;border:1px solid #e4e7ec;border-radius:20px;margin-bottom:14px;overflow:hidden}.body,.deep{padding:19px}.hero{padding:22px;background:linear-gradient(145deg,#eaf1ff,#fff)}.k{font-size:12px;font-weight:950;text-transform:uppercase;letter-spacing:.08em;color:#315efb}.muted,.meta{font-size:13px;color:#667085;line-height:1.5}h1{font-size:24px;line-height:1.15}h2{font-size:20px}.visual{margin-top:13px;padding:17px;border:1px solid #e7ebf0;background:#f8fafc;border-radius:15px;line-height:1.5}.flow{display:flex;align-items:center;gap:5px}.node{flex:1;background:#fff;border:1px solid #ddd;border-radius:10px;padding:9px 4px;text-align:center;font-size:11px;font-weight:800}.big{text-align:center;font-size:29px;font-weight:950}.good{background:#ecfdf3}.warn{background:#fff7ed}
.drop{border:2px dashed #b8c4d4;border-radius:18px;padding:28px 16px;text-align:center;background:#fafcff}.filebtn,.primary{display:inline-block;margin-top:15px;background:#101828;color:#fff;padding:12px 16px;border:0;border-radius:12px;font-weight:850;cursor:pointer}.filebtn input{display:none}.notice{margin-top:15px;padding:13px;background:#eef6ff;border:1px solid #cfe2ff;border-radius:13px;font-size:13px;line-height:1.5}.error{background:#fff1f2;border-color:#fecdd3}.articleRow{padding:15px;border-bottom:1px solid #eee;cursor:pointer}.articleRow:last-child{border:0}.danger{border:0;background:#fff1f2;color:#b42318;border-radius:9px;padding:7px 9px;font-weight:800;float:right}.save{border:0;background:#eef2ff;color:#315efb;border-radius:9px;padding:8px 10px;font-weight:900}.saved{background:#ecfdf3;color:#067647}.tag{display:inline-block;background:#eef2ff;color:#3448a3;padding:5px 8px;border-radius:99px;font-size:11px;font-weight:800;margin:2px}.deep{line-height:1.65}.deep h2{margin-top:28px}.empty{text-align:center;padding:42px 20px;color:#667085}
.option{display:block;width:100%;text-align:left;border:1px solid #dfe3e8;background:#fff;padding:13px;margin:9px 0;border-radius:12px;font-weight:700}.option.correct{background:#ecfdf3;border-color:#75d5a2}.option.wrong{background:#fff1f2;border-color:#fda4af}.explain{padding:13px;background:#f8fafc;border-radius:12px;margin-top:12px;line-height:1.5}.reviewCard{min-height:330px;display:flex;flex-direction:column;justify-content:center}.reviewQ{font-size:24px;font-weight:900;line-height:1.25}.answer{display:none;margin-top:20px;padding:18px;background:#eef6ff;border-radius:15px;font-size:18px;line-height:1.5}.answer.show{display:block}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);height:70px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(3,1fr);z-index:20}nav button{border:0;background:transparent;font-weight:800;color:#667085}nav button.on{color:#315efb}
</style></head><body><div class="app">
<header><div class="top"><div class="brand">Evidence<b>Feed</b></div><button id="lang" class="pill">🌐 EN</button></div>
<div class="tabs"><button class="tab on" data-mode="30">⚡ 30 sec</button><button class="tab" data-mode="3">📖 3 min</button><button class="tab" data-mode="10">🧠 10 min</button><button class="tab" data-mode="quiz">❓ Questions</button><button class="tab" data-mode="review">🔁 Review</button></div></header>
<main>
<section id="feed" class="screen on"><div id="feedContent"></div></section>
<section id="import" class="screen"><div class="panel body"><div class="k">Add article</div><h2>📥 Import EvidenceFeed</h2><p class="muted">Articles placed in the GitHub articles folder are loaded automatically. Manual .evidencefeed.json import remains available as a backup.</p><div class="drop"><div style="font-size:46px">📄 ➜ ✨</div><b>Import .evidencefeed.json</b><br><label class="filebtn">Choose file<input id="fileInput" type="file" accept=".json,.evidencefeed.json,application/json"></label></div><div id="msg" class="notice" style="display:none"></div></div></section>
<section id="library" class="screen"><div class="panel"><div class="body"><div class="k">Library</div><h2>Articles</h2><div class="muted">Only articles marked ♥ Saved are included in Review.</div></div><div id="libraryList"></div></div></section>
</main><nav><button class="on" data-screen="feed">⌂<br>Feed</button><button data-screen="import">＋<br>Import</button><button data-screen="library">♡<br>Library</button></nav></div>
<script>
let lang=localStorage.eflang||"en",mode=localStorage.efmode||"30",articles=JSON.parse(localStorage.getItem("ef_articles")||"[]"),current=localStorage.ef_current||"",reviewDeck=[],reviewIndex=0,quizIndex=0;
const $=x=>document.getElementById(x),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function valid(a){if(!a||!a.title||!a.content?.en||!a.content?.pt)throw Error("Invalid EvidenceFeed file");["30","3","10"].forEach(x=>{if(!a.content.en[x]||!a.content.pt[x])throw Error("Missing "+x+" content")});a.id=a.id||"ef-"+Date.now();a.saved=!!a.saved;return a}
function persist(){localStorage.setItem("ef_articles",JSON.stringify(articles));localStorage.ef_current=current}
function cur(){return articles.find(a=>a.id===current)||articles[0]}
function visual(c){let t=c.type||"plain",x=esc(c.text||"");if(t==="flow")return '<div class="visual flow">'+(c.items||[]).map(v=>'<div class="node">'+esc(v)+'</div>').join("›")+'</div>';if(t==="number")return '<div class="visual big">📊 '+x+'</div>';if(t==="question")return '<div class="visual" style="text-align:center"><div style="font-size:38px">🔬 → 📊 → ?</div>'+x+'</div>';return '<div class="visual '+(t==="good"?"good":t==="warning"?"warn":"")+'">'+x+'</div>'}
function hero(a){return '<div class="card hero"><div class="row"><div class="k">EvidenceFeed</div><button class="save '+(a.saved?"saved":"")+'" onclick="toggleSave(\''+a.id+'\')">'+(a.saved?"♥ Saved":"♡ Save")+'</button></div><h1>'+esc(a.title)+'</h1><div class="meta">'+esc(a.citation||"")+'</div></div>'}
function render(){document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));let a=cur();if(mode==="review"){renderReview();return}if(!a){$("feedContent").innerHTML='<div class="empty"><div style="font-size:52px">📚</div><h2>EvidenceFeed is empty</h2></div>';return}current=a.id;persist();let c=a.content[lang];if(mode==="10"){$("feedContent").innerHTML=hero(a)+'<article class="card deep">'+(c["10"].sections||[]).map(s=>'<h2>'+esc(s.heading)+'</h2><div>'+esc(s.text).replace(/\n/g,"<br>")+'</div>').join("")+'</article>';return}if(mode==="quiz"){renderQuiz(a);return}let cards=c[mode]?.cards||[];$("feedContent").innerHTML=hero(a)+cards.map((x,i)=>'<div class="card body"><div class="k">'+(i+1)+' / '+cards.length+'</div><h2>'+esc(x.title)+'</h2>'+visual(x)+'</div>').join("")}
window.toggleSave=id=>{let a=articles.find(x=>x.id===id);if(a){a.saved=!a.saved;persist();reviewDeck=[];render();renderLibrary()}}
function renderQuiz(a){let qs=a.content[lang].quiz||a.quiz?.[lang]||[];if(!qs.length){$("feedContent").innerHTML=hero(a)+'<div class="card body"><h2>No questions in this older article file</h2><p class="muted">Ask ChatGPT to regenerate it in EvidenceFeed v4.2 format.</p></div>';return}quizIndex=Math.min(quizIndex,qs.length-1);let q=qs[quizIndex];$("feedContent").innerHTML=hero(a)+'<div class="card body"><div class="k">Question '+(quizIndex+1)+' / '+qs.length+'</div><h2>'+esc(q.question)+'</h2><div id="opts">'+q.options.map((o,i)=>'<button class="option" onclick="answer('+i+','+q.correct+')"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</button>').join("")+'</div><div id="explain"></div><div class="row"><button class="btn" onclick="prevQ()">←</button><button class="primary" onclick="nextQ()">Next →</button></div></div>'}
window.answer=(i,c)=>{document.querySelectorAll(".option").forEach((b,n)=>{b.disabled=true;if(n===c)b.classList.add("correct");if(n===i&&i!==c)b.classList.add("wrong")});let a=cur(),q=(a.content[lang].quiz||a.quiz?.[lang]||[])[quizIndex];$("explain").innerHTML='<div class="explain"><b>'+(i===c?"✓ Correct":"✗ Incorrect")+'</b><br>'+esc(q.explanation||"")+'</div>'}
window.nextQ=()=>{let a=cur(),n=(a.content[lang].quiz||a.quiz?.[lang]||[]).length;quizIndex=(quizIndex+1)%n;render()};window.prevQ=()=>{let a=cur(),n=(a.content[lang].quiz||a.quiz?.[lang]||[]).length;quizIndex=(quizIndex-1+n)%n;render()}
function buildDeck(){reviewDeck=[];articles.filter(a=>a.saved).forEach(a=>{let r=a.content[lang].review||a.review?.[lang]||[];r.slice(0,15).forEach(x=>reviewDeck.push({...x,article:a.title}))});for(let i=reviewDeck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[reviewDeck[i],reviewDeck[j]]=[reviewDeck[j],reviewDeck[i]]}reviewIndex=0}
function renderReview(){if(!reviewDeck.length)buildDeck();if(!reviewDeck.length){$("feedContent").innerHTML='<div class="empty"><div style="font-size:52px">🔁</div><h2>No review cards yet</h2><p>Save articles with ♥ and use v4.2 article files containing 15 review cards.</p></div>';return}let x=reviewDeck[reviewIndex];$("feedContent").innerHTML='<div class="card body reviewCard"><div class="k">Random review · '+(reviewIndex+1)+' / '+reviewDeck.length+'</div><div class="muted">'+esc(x.article)+'</div><div class="reviewQ">'+esc(x.front)+'</div><div id="ans" class="answer">'+esc(x.back)+'</div><button class="primary" onclick="document.getElementById(\'ans\').classList.add(\'show\')">Show answer</button><div class="row"><button class="btn" onclick="shuffleReview()">🔀 Shuffle</button><button class="primary" onclick="nextReview()">Next →</button></div></div>'}
window.nextReview=()=>{reviewIndex=(reviewIndex+1)%reviewDeck.length;renderReview()};window.shuffleReview=()=>{reviewDeck=[];buildDeck();renderReview()}
function renderLibrary(){if(!articles.length){$("libraryList").innerHTML='<div class="empty">No articles.</div>';return}$("libraryList").innerHTML=articles.map(a=>'<div class="articleRow" data-id="'+esc(a.id)+'"><button class="danger" data-del="'+esc(a.id)+'">Delete</button><button class="save '+(a.saved?"saved":"")+'" data-save="'+esc(a.id)+'">'+(a.saved?"♥ Saved":"♡ Save")+'</button><b style="display:block;margin-top:8px">'+esc(a.title)+'</b><div class="muted">'+esc(a.citation||"")+'</div></div>').join("");document.querySelectorAll(".articleRow").forEach(r=>r.onclick=e=>{if(e.target.dataset.del||e.target.dataset.save)return;current=r.dataset.id;persist();show("feed");render()});document.querySelectorAll("[data-save]").forEach(b=>b.onclick=e=>{e.stopPropagation();toggleSave(b.dataset.save)});document.querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{e.stopPropagation();articles=articles.filter(a=>a.id!==b.dataset.del);current=articles[0]?.id||"";persist();reviewDeck=[];renderLibrary();render()})}
async function importArticle(a,automatic=false){a=valid(a);let old=articles.find(x=>x.id===a.id);if(old)a.saved=old.saved;let i=articles.findIndex(x=>x.id===a.id);if(i>=0)articles[i]=a;else articles.unshift(a);current=a.id;persist();reviewDeck=[];renderLibrary();render();if(automatic){history.replaceState(null,"",location.pathname);show("feed")}}
$("fileInput").onchange=async e=>{let m=$("msg");try{await importArticle(JSON.parse(await e.target.files[0].text()));m.style.display="block";m.className="notice";m.innerHTML="<b>✓ Imported</b> — article added to your library.";setTimeout(()=>show("feed"),500)}catch(err){m.style.display="block";m.className="notice error";m.textContent=err.message}e.target.value=""}
async function syncArticles(){try{let r=await fetch("./articles/index.json",{cache:"no-store"});if(!r.ok)return;let idx=await r.json(),files=idx.articles||idx||[],changed=false;for(let f of files){try{let q=await fetch("./articles/"+f,{cache:"no-store"});if(!q.ok)continue;let a=valid(await q.json()),old=articles.find(x=>x.id===a.id);if(old)a.saved=old.saved;let i=articles.findIndex(x=>x.id===a.id);if(i>=0)articles[i]=a;else articles.unshift(a);changed=true}catch(e){console.warn("Article sync failed",f,e)}}if(changed){if(!current&&articles[0])current=articles[0].id;persist();renderLibrary();render()}}catch(e){console.warn("EvidenceFeed sync unavailable",e)}}
async function directImport(){let h=location.hash;if(!h.startsWith("#import64=")&&!h.startsWith("#import="))return;try{let raw;if(h.startsWith("#import64=")){let b=h.slice(10).replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";let bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));raw=new TextDecoder().decode(bytes)}else{let b=h.slice(8).replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";let bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));let ds=new DecompressionStream("gzip"),stream=new Blob([bytes]).stream().pipeThrough(ds);raw=await new Response(stream).text()}await importArticle(JSON.parse(raw),true)}catch(e){alert("Could not import this EvidenceFeed link: "+e.message)}}
$("lang").onclick=()=>{lang=lang==="en"?"pt":"en";localStorage.eflang=lang;$("lang").textContent="🌐 "+lang.toUpperCase();reviewDeck=[];render()};document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;localStorage.efmode=mode;quizIndex=0;if(mode==="review")reviewDeck=[];render()});document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{show(b.dataset.screen);if(b.dataset.screen==="library")renderLibrary()});function show(id){document.querySelectorAll(".screen,nav button").forEach(x=>x.classList.remove("on"));$(id).classList.add("on");document.querySelector('nav button[data-screen="'+id+'"]').classList.add("on")}
$("lang").textContent="🌐 "+lang.toUpperCase();renderLibrary();render();syncArticles().then(()=>directImport());if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
