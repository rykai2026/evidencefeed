<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.json"><title>EvidenceFeed</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui;background:#07111f;color:#f8fafc}button{font:inherit}header{position:fixed;z-index:9;top:0;left:0;right:0;height:58px;background:#07111fee;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #ffffff18}.brand{font-weight:900;font-size:20px}.brand b{color:#67e8f9}.ver{margin-left:auto;color:#94a3b8;font-size:12px}main{height:100%;padding:58px 0 68px}.view{display:none;height:100%}.view.active{display:block}#feed{overflow-y:auto;scroll-snap-type:y mandatory}.reel{height:calc(100dvh - 126px);min-height:520px;scroll-snap-align:start;padding:24px;display:flex;flex-direction:column;justify-content:center;position:relative;border-bottom:1px solid #ffffff15;background:radial-gradient(circle at 80% 15%,#155e7566,transparent 30%),linear-gradient(150deg,#0c1c30,#07111f)}.ey{font-size:12px;letter-spacing:.14em;color:#67e8f9;font-weight:900}.reel h1{font-size:clamp(28px,7vw,46px);line-height:1.05;margin:10px 0 16px}.reel p{font-size:18px;line-height:1.5;color:#dbeafe}.reelimg{width:100%;max-height:38vh;object-fit:contain;background:white;border-radius:14px;margin-top:12px}.cap{font-size:11px;color:#94a3b8;margin-top:6px}.num{position:absolute;right:18px;bottom:15px;color:#64748b}.panel{height:100%;overflow:auto;padding:18px;max-width:820px;margin:auto}.card,.notice{background:#0d1b2d;border:1px solid #ffffff16;border-radius:18px;padding:18px;margin-bottom:14px}.notice{border-style:dashed;line-height:1.6}.opt{width:100%;text-align:left;padding:13px;margin:6px 0;border-radius:12px;border:1px solid #ffffff22;background:#12243b;color:#fff}.correct{background:#14532d!important}.wrong{background:#7f1d1d!important}.comment{display:none;background:#083344;margin-top:10px;padding:12px;border-radius:12px}.tabs{position:fixed;z-index:10;bottom:0;left:0;right:0;height:68px;background:#07111ff5;border-top:1px solid #ffffff18;display:grid;grid-template-columns:repeat(4,1fr)}.tab{border:0;background:none;color:#94a3b8;font-size:11px;font-weight:800}.tab span{display:block;font-size:21px}.tab.active{color:#67e8f9}.toggle{display:flex;gap:8px;margin:16px 0}.toggle button{padding:10px;border:1px solid #ffffff22;border-radius:10px;background:#12243b;color:white}.study{white-space:pre-wrap;line-height:1.65;color:#e2e8f0}.empty{height:100%;display:flex;align-items:center;justify-content:center;padding:24px}.emptybox{max-width:560px;width:100%;text-align:center}.emptybox h1{font-size:34px;margin:0 0 12px}.emptybox p{color:#cbd5e1;line-height:1.6}.danger{border-color:#7f1d1d;color:#fecaca}
</style></head><body><header><div class="brand">Evidence<b>Feed</b></div><div class="ver">v6.4 • PDFs bilíngues</div></header><main><section id="feed" class="view active"></section><section id="questions" class="view"><div class="panel" id="q"></div></section><section id="review" class="view"><div class="panel" id="r"></div></section><section id="article" class="view"><div class="panel" id="a"></div></section></main><nav class="tabs"><button class="tab active" data-v="feed"><span>🎞️</span>Feed</button><button class="tab" data-v="questions"><span>❓</span>Questions</button><button class="tab" data-v="review"><span>🔁</span>Review</button><button class="tab" data-v="article"><span>📄</span>Article</button></nav><script>
let A=null; const ACTIVE='ef_v63_active', DBNAME='EvidenceFeedDB', DBVER=1, OBJ='articles';
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function db(){return new Promise((res,rej)=>{let q=indexedDB.open(DBNAME,DBVER);q.onupgradeneeded=()=>{let d=q.result;if(!d.objectStoreNames.contains(OBJ))d.createObjectStore(OBJ,{keyPath:'id'})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function allArticles(){let d=await db();return new Promise((res,rej)=>{let q=d.transaction(OBJ,'readonly').objectStore(OBJ).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}
async function getArticle(id){let d=await db();return new Promise((res,rej)=>{let q=d.transaction(OBJ,'readonly').objectStore(OBJ).get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}
async function putArticle(x){let d=await db();return new Promise((res,rej)=>{let q=d.transaction(OBJ,'readwrite').objectStore(OBJ).put(x);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
async function deleteArticle(id){let d=await db();return new Promise((res,rej)=>{let q=d.transaction(OBJ,'readwrite').objectStore(OBJ).delete(id);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
function validArticle(x){return !!(x&&Array.isArray(x.reels)&&Array.isArray(x.questions)&&Array.isArray(x.review))}
function normalize(x){if(!validArticle(x))throw Error('Arquivo incompatível com o EvidenceFeed.'); x.id=x.id||('article-'+Date.now()); x.reels=x.reels.map((r,i)=>({eyebrow:r.eyebrow||'EVIDENCEFEED',title:r.title||`Reel ${i+1}`,text:r.text||r.body||'',image:r.image||(r.figure&&x.figures?x.figures[r.figure]:''),caption:r.caption||''})); const nq=z=>({question:z.question||z.q||'',options:Array.isArray(z.options)&&z.options.length?z.options:[z.answer,'Nenhuma das alternativas anteriores','Revisar o conceito','Não é possível concluir'].filter((v,i,a)=>v&&a.indexOf(v)==i),answer:z.answer||'',comment:z.comment||''}); x.questions=x.questions.map(nq);x.review=x.review.map(nq);return x}
function addButton(){return `<input class="articleUpload" type="file" accept=".json,.efarticle,application/json" hidden><button class="opt addArticle" style="font-weight:800;text-align:center">＋ Adicionar artigo</button><div class="cap">Selecione o .efarticle gerado pelo ChatGPT. PDFs e imagens são armazenados no IndexedDB deste aparelho.</div>`}
function bindUploads(){document.querySelectorAll('.addArticle').forEach((b,i)=>{let inp=b.previousElementSibling;b.onclick=()=>inp.click();inp.onchange=()=>importArticleFile(inp.files[0])})}
function empty(){ $('feed').innerHTML=`<div class="empty"><div class="emptybox"><h1>EvidenceFeed</h1><p>Nenhum artigo instalado neste aparelho. Adicione o primeiro arquivo gerado no ChatGPT.</p>${addButton()}</div></div>`; $('q').innerHTML='<div class="notice">Adicione um artigo para acessar as Questions.</div>'; $('r').innerHTML='<div class="notice">Adicione um artigo para acessar o Review.</div>'; $('a').innerHTML=`<h2>Article</h2><div class="notice">Os artigos não ficam no GitHub. Eles são adicionados manualmente e armazenados no IndexedDB deste aparelho.</div>${addButton()}`; bindUploads() }
async function render(){if(!A)return empty(); $('feed').innerHTML=A.reels.map((x,i)=>`<article class="reel"><div class="ey">${esc(x.eyebrow)}</div><h1>${esc(x.title)}</h1><p>${esc(x.text)}</p>${x.image?`<img class="reelimg" src="${x.image}" alt=""><div class="cap">${esc(x.caption)}</div>`:''}<div class="num">${i+1}/${A.reels.length} ↑</div></article>`).join(''); quiz(A.questions,$('q'),'Questions'); quiz([...A.review].sort(()=>Math.random()-.5),$('r'),`Review • ${A.review.length} questões`); await articleHome()}
function quiz(xs,el,title){el.innerHTML=`<h2>${esc(title)}</h2>`+xs.map((x,i)=>`<div class="card"><small>${i+1} de ${xs.length}</small><h3>${esc(x.question)}</h3>${x.options.map(o=>`<button class="opt" data-answer="${encodeURIComponent(x.answer)}">${esc(o)}</button>`).join('')}<div class="comment"><b>Comentário:</b> ${esc(x.comment)}</div></div>`).join('');el.querySelectorAll('.card').forEach(c=>c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(c.dataset.done)return;c.dataset.done=1;let ans=decodeURIComponent(b.dataset.answer);c.querySelectorAll('.opt').forEach(z=>{if(z.textContent===ans)z.classList.add('correct')});if(b.textContent!==ans)b.classList.add('wrong');let cm=c.querySelector('.comment');if(cm)cm.style.display='block'}))}
async function articleHome(){let list=await allArticles(); $('a').innerHTML=`<h2>${esc(A.title||A.id)}</h2><p>${esc(A.authors||'')}<br>${esc(A.journal||'')} ${A.year?'('+esc(A.year)+')':''}${A.doi?' • DOI '+esc(A.doi):''}</p><div class="toggle"><button onclick="openOriginal()">🇺🇸 Original</button><button onclick="openPt()">🇧🇷 Português</button></div><div class="notice">Este artigo está armazenado localmente no IndexedDB. Se o pacote contém PDF incorporado, Original abre exatamente esse PDF.</div>${addButton()}${list.length>1?`<h3>Meus artigos</h3>${list.map(x=>`<button class="opt" onclick="selectArticle('${encodeURIComponent(x.id)}')">${esc(x.title||x.id)}</button>`).join('')}`:''}<button class="opt danger" onclick="removeActive()">Remover artigo deste aparelho</button>`;bindUploads()}
function b64Blob(data,mime='application/pdf'){let raw=data.includes(',')?data.split(',').pop():data;let bin=atob(raw),n=bin.length,u=new Uint8Array(n);for(let i=0;i<n;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
function openOriginal(){let p=A.article?.originalPdf||A.originalPdf;if(p){try{let blob;if(typeof p==='object'&&p.data)blob=b64Blob(p.data,p.mimeType||p.mime||'application/pdf');else if(typeof p==='string'&&p.startsWith('data:'))blob=b64Blob(p,'application/pdf');if(blob){let u=URL.createObjectURL(blob);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),120000);return}if(typeof p==='string'){window.open(p,'_blank');return}}catch(e){alert('Não foi possível abrir o PDF incorporado. '+e.message);return}}let u=A.article?.originalUrl;if(u)window.open(u,'_blank');else alert('Este pacote não contém o PDF original.')}
function openPt(){let p=A.article?.portuguesePdf||A.portuguesePdf;if(p){try{let blob;if(typeof p==='object'&&p.data)blob=b64Blob(p.data,p.mimeType||p.mime||'application/pdf');else if(typeof p==='string'&&p.startsWith('data:'))blob=b64Blob(p,'application/pdf');if(blob){let u=URL.createObjectURL(blob);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),120000);return}if(typeof p==='string'){window.open(p,'_blank');return}}catch(e){alert('Não foi possível abrir o PDF em português. '+e.message);return}}let c=A.studyPortuguese?.content||A.article?.portugueseText||A.article?.translationText; $('a').innerHTML=`<button class="opt" onclick="articleHome()">← Voltar</button><h2>${esc(A.studyPortuguese?.title||'Português')}</h2><div class="card study">${esc(c||'Versão em português não disponível neste pacote.')}</div>`}
async function importArticleFile(file){if(!file)return;try{let incoming=normalize(JSON.parse(await file.text()));await putArticle(incoming);localStorage.setItem(ACTIVE,incoming.id);A=incoming;await render();showView('feed');alert('Artigo adicionado com sucesso: '+(A.title||A.id))}catch(e){alert('Não foi possível adicionar o artigo. '+e.message)}}
async function selectArticle(id){id=decodeURIComponent(id);A=await getArticle(id)||A;localStorage.setItem(ACTIVE,A.id);await render();showView('feed')}
async function removeActive(){if(!A)return;await deleteArticle(A.id);let lib=await allArticles();A=lib[0]||null;if(A)localStorage.setItem(ACTIVE,A.id);else localStorage.removeItem(ACTIVE);await render();showView('article')}
function showView(id){document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('active'));document.querySelector(`.tab[data-v="${id}"]`)?.classList.add('active');$(id).classList.add('active')}
async function migrateLegacy(){let keys=['ef_v62_articles','ef_v61_articles'];for(let k of keys){try{let raw=localStorage.getItem(k);if(!raw)continue;let xs=JSON.parse(raw);for(let x of xs){try{await putArticle(normalize(x))}catch(e){}} localStorage.removeItem(k)}catch(e){}}let old=localStorage.getItem('ef_v62_active')||localStorage.getItem('ef_v61_active');if(old&&!localStorage.getItem(ACTIVE))localStorage.setItem(ACTIVE,old)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showView(b.dataset.v));if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');(async()=>{try{await migrateLegacy();let lib=await allArticles();let active=localStorage.getItem(ACTIVE);A=lib.find(x=>x.id===active)||lib[0]||null;await render()}catch(e){empty();alert('Erro ao abrir a biblioteca local: '+e.message)}})();
</script></body></html>
